[package]
name = "threadpulse"
version = "0.1.0"
edition = "2021"
authors = ["bedrickov <kirohubsup@gmail.com>"]
description = "Ultra-low latency Windows NT thread execution and context switch sampler via native NT APIs"
license = "MIT"

[dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Security"
] }
